    "librosa==0.10.2.post1",
    "matplotlib==3.10.0",
    "modelscope==1.27.0",
    "munch==4.0.0",
    "numba==0.63.0",
    "numpy==2.2.6",
    "omegaconf>=2.3.0",
    "opencv-python==4.9.0.80",
    "pandas==2.3.2",
    "safetensors==0.5.2",
    "sentencepiece>=0.2.1",
